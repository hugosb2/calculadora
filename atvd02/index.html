<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="header"><img src="../assets/icone.png" width="60px" height="60px"><b>Calculadora e tabuadas</b></div>
    <div class="corpo">
        <div class="title"><b>Calculadora</b></div>
        <input id="a" class="input" type="number" placeholder="Digite um número">
        <input id="b" class="input" type="number" placeholder="Digite outro número">

        <button class="botao" onclick="soma('a','b')">
            +
        </button>
        <button class="botao" onclick="sub('a','b')">
            -
        </button>
        <button class="botao" onclick="mult('a','b')">
            X
        </button>
        <button class="botao" onclick="div('a','b')">
            /
        </button>

        <p class="resultado" id="resultado"></p>
        <p class="resultadored" id="resultadored"></p>
    </div>
    <div class="corpo-parte2">
        <div class="title"><b>Tabuadas de soma e subtração</b></div>
        <ol>
            <li>Tabuada de soma</li>
            <table class="tabuada">
                <tr>
                    <th>1</th>
                    <th>+</th>
                    <th>2</th>
                    <th>=</th>
                    <th>3</th>
                </tr>
                <tr>
                    <th>2</th>
                    <th>+</th>
                    <th>2</th>
                    <th>=</th>
                    <th>4</th>
                </tr>
                <tr>
                    <th>3</th>
                    <th>+</th>
                    <th>2</th>
                    <th>=</th>
                    <th>5</th>
                </tr>
                <tr>
                    <th>4</th>
                    <th>+</th>
                    <th>2</th>
                    <th>=</th>
                    <th>6</th>
                </tr>
                <tr>
                    <th>5</th>
                    <th>+</th>
                    <th>2</th>
                    <th>=</th>
                    <th>7</th>
                </tr>  
            </table>
            <li>Tabuada de subtração</li>
            <table class="tabuada">
                <tr>
                    <th>1</th>
                    <th>-</th>
                    <th>2</th>
                    <th>=</th>
                    <th>-1</th>
                </tr>
                <tr>
                    <th>2</th>
                    <th>-</th>
                    <th>2</th>
                    <th>=</th>
                    <th>0</th>
                </tr>
                <tr>
                    <th>3</th>
                    <th>-</th>
                    <th>2</th>
                    <th>=</th>
                    <th>1</th>
                </tr>
                <tr>
                    <th>4</th>
                    <th>-</th>
                    <th>2</th>
                    <th>=</th>
                    <th>2</th>
                </tr>
                <tr>
                    <th>5</th>
                    <th>-</th>
                    <th>2</th>
                    <th>=</th>
                    <th>3</th>
                </tr>  
            </table>
        </ol>
    </div>
</body>
</html>
